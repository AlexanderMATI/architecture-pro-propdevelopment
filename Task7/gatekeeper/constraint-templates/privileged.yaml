apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spspforbiddenprivilege
spec:
  crd:
    spec:
      names:
        kind: K8sPSPForbiddenPrivilege
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spspforbiddenprivilege
        
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged == true
          msg := sprintf("Привилегированный контейнер запрещен: %s", [container.name])
        }
        
        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          container.securityContext.privileged == true
          msg := sprintf("Привилегированный init-контейнер запрещен: %s", [container.name])
        }